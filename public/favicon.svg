<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="spike" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#ff5c9d"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#14151a"/>

  <g transform="translate(32 32)">
    <!-- radiating spines, 12-fold symmetry -->
    <g stroke="url(#spike)" stroke-width="1.6" stroke-linecap="round" fill="none">
      <g id="spine">
        <line x1="0" y1="0" x2="0" y2="-27"/>
        <line x1="-2.2" y1="-16" x2="2.2" y2="-16"/>
      </g>
      <use href="#spine" transform="rotate(30)"/>
      <use href="#spine" transform="rotate(60)"/>
      <use href="#spine" transform="rotate(90)"/>
      <use href="#spine" transform="rotate(120)"/>
      <use href="#spine" transform="rotate(150)"/>
      <use href="#spine" transform="rotate(180)"/>
      <use href="#spine" transform="rotate(210)"/>
      <use href="#spine" transform="rotate(240)"/>
      <use href="#spine" transform="rotate(270)"/>
      <use href="#spine" transform="rotate(300)"/>
      <use href="#spine" transform="rotate(330)"/>
    </g>

    <!-- lattice shell rings -->
    <circle r="18.5" fill="none" stroke="#f2f2f5" stroke-width="1.4" opacity="0.9"/>
    <circle r="12.5" fill="none" stroke="#f2f2f5" stroke-width="1.1" opacity="0.65"/>

    <!-- hexagonal lattice cells on outer ring -->
    <g stroke="#f2f2f5" stroke-width="0.9" opacity="0.55" fill="none">
      <path d="M 0,-18.5 L 9.25,-16 L 9.25,-9.25 L 0,-12.5 Z" transform="rotate(0)"/>
      <path d="M 0,-18.5 L 9.25,-16 L 9.25,-9.25 L 0,-12.5 Z" transform="rotate(60)"/>
      <path d="M 0,-18.5 L 9.25,-16 L 9.25,-9.25 L 0,-12.5 Z" transform="rotate(120)"/>
      <path d="M 0,-18.5 L 9.25,-16 L 9.25,-9.25 L 0,-12.5 Z" transform="rotate(180)"/>
      <path d="M 0,-18.5 L 9.25,-16 L 9.25,-9.25 L 0,-12.5 Z" transform="rotate(240)"/>
      <path d="M 0,-18.5 L 9.25,-16 L 9.25,-9.25 L 0,-12.5 Z" transform="rotate(300)"/>
    </g>

    <!-- central core -->
    <circle r="5.5" fill="url(#spike)"/>
  </g>
</svg>
